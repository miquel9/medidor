[project]
name = "medidor"
version = "0.0.1"
description = "Medidor universal de objetos a partir de fotografías usando referencias de tamaño normalizado."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medidor"]
